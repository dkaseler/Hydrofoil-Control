<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hydrofoil device setup</title><link rel="stylesheet" href="/style.css"></head><body><div class="content"><h1>Device setup</h1><div class="card"><p>Station MAC for pairing: <strong id="mac">…</strong></p><form action="/setup" method="POST"><label>Role <select name="role" id="role" disabled><option value="master">Master</option><option value="slave">Slave</option></select></label><p>Saving restarts this board. Its HF-Bench hotspot remains available in either role.</p><button id="save-role" disabled>Save role and restart</button><p id="setup-error" role="status"></p></form><p>Updates use the board hotspot directly. Existing router credentials remain stored.</p><a href="/">Return to controller</a></div></div><script>const role=document.getElementById('role'),save=document.getElementById('save-role'),error=document.getElementById('setup-error');async function loadSetup(){try{const [m,d]=await Promise.all([fetch('/get-mac'),fetch('/device-status')]);if(!m.ok||!d.ok)throw Error('Could not load device settings');document.getElementById('mac').textContent=await m.text();const state=await d.json();role.value=state.slave?'slave':'master';role.disabled=false;save.disabled=false;}catch(e){error.textContent='Settings unavailable. Reload before saving.';}}loadSetup();</script></body></html>
